<div
  class="flex flex-col items-center text-center group h-full px-5 pb-3.5 pt-7 shadow-[0px_3px_13.8px_1.2px_rgba(152,152,152,0.2)]">

  <!-- Image -->
  <div
    class="h-40 overflow-hidden transition-transform duration-300 group-hover:scale-105 cursor-pointer"
    role="button"
    tabindex="0"
    (click)="visible = true"
  >
    <img src="{{ pizza()?.image }}" class="w-full h-auto object-cover max-w-[260px]" [alt]="pizza()?.title">
  </div>

  <!-- Description -->
  <div class="flex flex-col flex-grow w-full">
    <h3 class="font-muller font-bold text-lg text-pizza-dark-warm min-h-10 flex items-center justify-center">
      {{ pizza()?.title }}
    </h3>

    <p class="font-muller font-normal text-sm leading-tight text-pizza-dark-graphite flex-grow">
      {{ pizza()?.description }}
    </p>

    <button
      type="button"
      class="mt-3 bg-pizza-orange px-10 py-4 font-muller font-bold text-pizza-brown-warm transition-transform hover:scale-105 active:scale-95 cursor-pointer">
      В корзину
    </button>
  </div>
</div>

<p-drawer
  styleClass="pizza-fullscreen-drawer !bg-transparent"
  [fullScreen]="true"
  [(visible)]="visible"
>
  <ng-template #headless>
    <div class="card h-[100px] flex items-center justify-end p-4">
      <p-button
        icon="pi pi-times"
        outlined="true"
        styleClass="!h-10 !w-10 !bg-white"
        (click)="visible=false"/>
    </div>

    <div
      role="button"
      tabindex="0"
      class="flex items-center justify-center h-full w-full p-14"
      (click)="visible = false"
    >
      <div class="max-w-3xl max-h-svh w-full h-auto bg-transparent">
        <img
          class="w-full h-full object-contain pointer-events-none"
          alt="Full size pizza"
          [src]="pizza()?.image">
      </div>
    </div>
  </ng-template>
</p-drawer>
